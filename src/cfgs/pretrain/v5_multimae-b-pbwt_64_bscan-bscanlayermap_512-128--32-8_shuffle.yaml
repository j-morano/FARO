# Input and output tasks
in_domains: bscan-bscanlayermap
out_domains: bscan-bscanlayermap
standardize_depth: True
extra_norm_pix_loss: False  # Original: True

# Architecture
model: pretrain_miragev2wt_base
decoder_dim: 256
input_size:
  bscan: [512, 512]
  bscanlayermap: [128, 128]
patch_size:
  bscan: [32, 32]
  bscanlayermap: [8, 8]
alphas: 1.0  # Dirichlet concentration parameter
num_encoded_tokens: 64 # Total would be 196 * 3 patches. 196 / 2 = 98
num_global_tokens: 10
decoder_use_task_queries: True
decoder_depth: 2
sample_only: null
# weights: '_weights/multimae-b_98_rgb+-depth-semseg_1600e_multivit-afff3f8c.pth'
# weights: '_weights/v3_vit-b_bscan_bscanlayermap.pth'
# weights: '_weights/MIRAGE-Base.pth'
weights: '_weights/MIRAGE-Base.pth'

# Train
epochs: 100 # Original: 1600
opt: adamw
blr: 0.0001 # this is base_lr = 1e-4, lr = base_lr * batch_size / 256
warmup_lr: 0.000001 # 1e-6
min_lr: 0.
warmup_epochs: 10 # Original: 40
batch_size: 1024  # Original: 256
# 16 works for 768x768 images
hflip: 0.5
vflip: 0.0  # Added
loss_on_unmasked: False
save_ckpt_freq: 5
contrastive: False
patient_balanced: True
repeat_dataset: 100
intensity_shift: 0.05
filelist: ./cfgs/training_databank.joblib

# Data
data_path: '/raid/optima/FullVIBES-v2/v2_bscanlayermap/'
# data_path: '/msc/home/jmoran82/FullVIBES-v2/'

# Wandb logging
log_wandb: False # Set to True to log to Weights & Biases
wandb_project: 'multimae-pretrain'
wandb_entity: null # Change if needed
